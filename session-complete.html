<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Complete — Rana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Semi+Condensed:wght@500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    Tap anywhere on the page to skip the XP reveal straight to its final
    state. People who've asked their device for reduced motion get that
    final state right away (same approach as the analysis page).
  -->
  <main class="screen" id="summary-screen">
    <!-- Only shown when opened from the workout history. -->
    <a id="top-back" href="history.html" class="back-link" hidden>← Workout history</a>

    <p id="system-label" class="system-label">[ SYSTEM ]</p>
    <h1 id="system-heading" class="system-heading">SESSION COMPLETE</h1>

    <!-- What you just did: title, kind, and the headline numbers. -->
    <header class="recap-head">
      <p id="recap-kind" class="today-eyebrow"></p>
      <h2 id="recap-title" class="recap-title"></h2>
      <p id="recap-meta" class="recap-meta"></p>
    </header>

    <!-- The XP reveal: lines land one at a time while the total counts up;
         big gains get a "NEW RECORD" moment; the level bar fills last. -->
    <section id="xp-panel" class="panel xp-panel" aria-label="XP gained">
      <p class="today-eyebrow">XP gained</p>
      <p id="xp-total" class="xp-total num" aria-live="polite">+0 XP</p>
      <ul id="xp-lines" class="xp-lines"></ul>

      <div class="xp-level">
        <div class="xp-level-row">
          <span id="xp-level-label" class="xp-level-label"></span>
          <span id="xp-level-progress" class="xp-level-progress num"></span>
        </div>
        <div id="xp-bar" class="stat-bar"></div>
      </div>
    </section>

    <!-- Shown only when this session earned a new title. -->
    <p id="title-earned" class="title-earned" hidden></p>

    <!-- Every exercise and set from this workout. "Edit" swaps the list for
         an editor where any set can be corrected or removed (a typo like
         1000 lb would otherwise count as a "best" forever), or the whole
         workout deleted. XP and levels recalculate from whatever's saved. -->
    <section class="panel recap-panel" aria-label="Your workout">
      <div class="panel-head">
        <p class="eyebrow">Your workout</p>
        <button id="edit-btn" type="button" class="btn-quiet btn-quiet--accent">Edit</button>
      </div>
      <ul id="recap-exercises" class="recap-exercises"></ul>

      <div id="recap-editor" class="recap-editor" hidden>
        <p class="session-note">Fix any typo, or remove a set you didn't do. XP, levels and stats recalculate when you save.</p>
        <div id="editor-exercises"></div>
        <p id="editor-error" class="status-message status-message--error" aria-live="polite"></p>
        <div class="editor-actions">
          <button id="editor-save" type="button" class="btn-continue">Save changes</button>
          <button id="editor-cancel" type="button" class="btn-secondary">Cancel</button>
        </div>
        <button id="delete-workout" type="button" class="btn-quiet btn-quiet--danger">Delete this workout</button>
      </div>
    </section>

    <div id="stat-gains" class="panel"></div>

    <div class="quote-panel">
      <span id="quote-text"></span>
      <span id="quote-attribution" class="quote-attribution"></span>
    </div>

    <div class="summary-actions">
      <a id="bottom-primary" href="dashboard.html" class="btn-continue btn-link">Back to dashboard</a>
      <a id="bottom-secondary" href="history.html" class="btn-secondary btn-link">Workout history</a>
    </div>
  </main>

  <!-- Level-up "title card": the screen dims, a line sweeps across, then
       the level number slams in (animations in styles.css, turned off for
       people who've asked their device for reduced motion). -->
  <div id="level-up-backdrop" class="modal-backdrop title-card-backdrop" hidden>
    <div class="title-card level-up-modal">
      <span class="title-card-sweep" aria-hidden="true"></span>
      <p class="title-card-label">LEVEL UP</p>
      <p id="level-up-value" class="title-card-value num"></p>
      <p id="level-up-powered" class="title-card-powered"></p>
      <button type="button" class="btn-continue" data-close-modal>Continue</button>
    </div>
  </div>

  <!-- Tier-up "transformation": bigger than a level-up, in the new tier's
       glow color (set via data-tier). -->
  <div id="tier-up-backdrop" class="modal-backdrop title-card-backdrop" hidden>
    <div id="tier-up-card" class="title-card tier-up-modal">
      <span class="title-card-sweep" aria-hidden="true"></span>
      <p class="title-card-label">TIER ADVANCEMENT</p>
      <p id="tier-up-value" class="title-card-value"></p>
      <p id="tier-up-level" class="title-card-sub num"></p>
      <p id="tier-up-powered" class="title-card-powered"></p>
      <button type="button" class="btn-continue" data-close-modal>Continue</button>
    </div>
  </div>

  <script src="data.js" defer></script>
  <script src="storage.js" defer></script>
  <script src="plan.js" defer></script>
  <script src="game.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="session-complete.js" defer></script>
  <script src="nav.js" defer></script>
</body>
</html>
