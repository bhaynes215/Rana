<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout History — Rana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Semi+Condensed:wght@500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    Every finished workout — suggested, your own plan and freestyle — newest
    first, grouped by month. Tapping one opens its summary (session-complete.html in
    history mode: no replayed animation), where sets can be fixed or the
    workout deleted. Built by history.js from the session records.
  -->
  <main class="screen history">
    <header class="history-head">
      <h1 class="history-title">Workout history</h1>
      <p id="history-summary" class="history-summary"></p>
    </header>

    <div id="history-list" class="history-list"></div>
  </main>

  <script src="data.js" defer></script>
  <script src="storage.js" defer></script>
  <script src="plan.js" defer></script>
  <script src="game.js" defer></script>
  <script src="history.js" defer></script>
  <script src="nav.js" defer></script>
</body>
</html>
