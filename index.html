<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rana</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <script src="js/core/transitions.js"></script>
</head>
<body>
  <!--
    The front door. It draws nothing of its own: it looks at what is saved
    and sends the visitor on (replace, so the Back button never lands here).
      no profile          -> the questionnaire
      plan not started    -> the plan reveal
      plan started        -> Today

    The two scripts have no `defer` on purpose: the routing must run right
    away, and a plain script after a deferred one would run first (and hit
    "Rana is not defined"). This is the one page allowed to do that.
  -->
  <main class="page"></main>
  <script src="js/core/storage.js"></script>
  <script>
    const profile = Rana.storage.getProfile();
    const plan = Rana.storage.getPlan();
    const started = plan && plan.status === "active";
    window.location.replace(!profile || !plan ? "onboarding.html" : started ? "today.html" : "plan-reveal.html");
  </script>
</body>
</html>
