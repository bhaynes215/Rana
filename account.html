<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Rana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Semi+Condensed:wght@500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    Account: your name, level, tier and earned titles, your email and your questionnaire answers, each editable. Changing your goal
    or training days re-picks Rana's plan (after asking). Built by account.js.
  -->
  <main class="screen history">
    <section id="char-sheet" class="panel account-sheet">
      <h1 id="char-name" class="account-name"></h1>
      <p class="account-level">
        <span id="char-level" class="num"></span>
        <span id="char-tier" class="account-tier"></span>
      </p>
      <p id="char-xp" class="history-summary"></p>
      <ul id="char-titles" class="account-titles"></ul>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Account</h2></div>
      <dl class="account-rows">
        <div class="account-row">
          <dt>Email</dt>
          <dd id="account-email"></dd>
        </div>
      </dl>
      <button type="button" class="btn-secondary" disabled>Sign out</button>
      <p class="account-note">Coming with real accounts. For now, everything is saved in this browser only.</p>
    </section>

    <!-- Collapsed by default: the answers are there if you want them, but
         they don't fill the page. The whole header is the toggle. -->
    <section class="panel">
      <button type="button" id="answers-toggle" class="account-toggle" aria-expanded="false" aria-controls="answers-body">
        <span class="account-toggle-text">
          <span class="account-toggle-title">Your answers</span>
          <span class="account-toggle-sub">Goal, training days, body stats and more</span>
        </span>
        <span class="plan-day-chevron" aria-hidden="true"></span>
      </button>
      <div id="answers-body" hidden>
        <p class="account-note account-note--top">Changing your goal or training days updates Rana's plan. Your workouts and XP always stay.</p>
        <dl id="answer-rows" class="account-rows"></dl>
      </div>
    </section>
  </main>

  <script src="data.js" defer></script>
  <script src="storage.js" defer></script>
  <script src="plan.js" defer></script>
  <script src="game.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="account.js" defer></script>
</body>
</html>
